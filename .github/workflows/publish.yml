name: Publish

# GitHub Packages へ application-ui-kit を公開する。
#
# UI Platform repository のreleaseとnpm packageのreleaseを分離する。
# - v1.0.0                              -> UI Platform repository release。package publishは行わない
# - application-ui-kit-v<package-version> -> application-ui-kit package release
#
# package release tagのversionは package.json と一致しなければならない。
# workflow_dispatchでは package.json のversionをそのままpublishする。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: npm publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'application-ui-kit-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bun のセットアップ
        uses: oven-sh/setup-bun@v2

      - name: 依存のインストール
        run: bun install --frozen-lockfile

      - name: パッケージ名を決める
        id: pkg
        run: |
          SCOPE="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          BASE="$(node -p "require('./package.json').name.split('/').pop()")"
          echo "scope=@${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "name=@${SCOPE}/${BASE}" >> "$GITHUB_OUTPUT"

      - name: 検証
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run build
          bun run verify:package

      - name: package release tag と version の一致を確認
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#application-ui-kit-v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::package release tag ($RELEASE_TAG) と package.json の version ($VERSION) が一致しません"
            exit 1
          fi

      - name: Node のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "${{ steps.pkg.outputs.scope }}"

      - name: パッケージ名をrepository ownerのscopeへ合わせる
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "./package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            const name = process.argv[1];
            if (pkg.name !== name) {
              pkg.name = name;
              fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
            }
          ' "${{ steps.pkg.outputs.name }}"

      - name: publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
